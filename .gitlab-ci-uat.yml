uat_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: UAT
    url: http://uat-gsr.saba.vin/
  only:
    - /^l1-deploy-uat-\d{8}-\d+.*$/
    - /^l1-deploy-\d{8}-\d+.*$/

uat_restart:
  extends: .restart-service
  environment:
    name: RESTART-UAT
  only: 
    - /^l1-rs-uat-\d{8}-\d+.*$/