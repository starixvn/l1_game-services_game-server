uat_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: UAT
    url: http://uat-gsr.saba.vin/
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - when: never

uat_restart:
  extends: .restart-service
  environment:
    name: RESTART-UAT
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-rs-uat-\d{8}-\d+.*$/
      when: always