local_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: LOCAL
  only:
    - /^l1-deploy-local-\d{8}-\d+.*$/
    - /^l1-deploy-\d{8}-\d+.*$/

local_restart:
  extends: .restart-service
  environment:
    name: RESTART-LOCAL
  only: 
    - /^l1-rs-local-\d{8}-\d+.*$/

  