local_deploy:
  extends:
    - .base-deploy
  script:
    - tar czf - ./* | ssh root@$HOST "cd /var/www/l1/game-api/ && tar xvzf -"
    - ssh root@$HOST 'npm install --prefix /var/www/l1/game-api/ | cp /var/www/l1/game-api/config/appConfigs.LOCAL.js /var/www/l1/game-api/config/appConfigs.js | sudo service l1-game-api restart'
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/

local_restart:
  extends: .base-restart-service
  script:
    - ssh root@$HOST 'sudo service l1-game-api restart'
  environment:
    name: RESTART-LOCAL
  only: 
    - /^rs-local-\d{8}-\d+.*$/

  