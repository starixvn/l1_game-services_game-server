local_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: LOCAL
  rules:
    - if: $CI_COMMIT_TAG =~ /^l2-deploy-local-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l2-deploy-\d{8}-\d+.*$/
      when: always
    - when: never

local_restart:
  extends: .restart-service
  environment:
    name: RESTART-LOCAL
  rules:
    - if: $CI_COMMIT_TAG =~ /^l2-rs-local-\d{8}-\d+.*$/
      when: always


  
