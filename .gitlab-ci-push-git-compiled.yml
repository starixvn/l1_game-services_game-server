.push-git-compiled:
  script: 
    - echo "====== Pushing git compiled ... ======"
    - git config --global user.email "luminet.minigame.app@gmail.com"
    - git config --global user.name "Luminet"
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - export BUILD_PATH=~/build/${CI_COMMIT_SHA:0:8}
    - export BUILD_TEMP_PATH=~/temp/${CI_COMMIT_SHA:0:8}
    - rm -rf $BUILD_PATH
    - mkdir $BUILD_PATH
    - cp ./config/appConfigs.${CI_ENVIRONMENT_NAME}.js ./config/appConfigs.js
    - git clone --branch $GIT_BRANCH $GIT_COMPILED_REPO $BUILD_PATH/
    - mkdir $BUILD_TEMP_PATH
    - mv $BUILD_PATH/.git $BUILD_TEMP_PATH
    - rm -rfv $BUILD_PATH/
    - cp -r $BUILD_TEMP_PATH $BUILD_PATH/
    - cp -R ./* $BUILD_PATH/
    - cd $BUILD_PATH/
    - npm install
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
    - rm -rf $BUILD_PATH
    - rm -rf $BUILD_TEMP_PATH