prod_deploy:
  stage: deploy
  extends: 
    - .base-deploy
    - .push-git-compiled
  before_script:
    - apt-get update
    - apt-get install -y build-essential python
    - curl -sL https://deb.nodesource.com/setup_12.x | bash -
    - apt-get install -y nodejs
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - echo "{\"release\":\"${CI_COMMIT_SHA:1}\"}" > sentryConfig.json
  environment:
    name: PRO
    url: http://gsr.saba.club/
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual

sentry_release:
  image: getsentry/sentry-cli
  stage: post-deploy
  before_script:
    - export SENTRY_URL=https://sentry.saba.vin/
    - export SENTRY_LOG_LEVEL=info
    - export SENTRY_AUTH_TOKEN=896707cb8ea745c6af2973c80f1d8a5674d13c81670c493f851dfb11cabe6c3d
    - export SENTRY_ORG=luminet
    - export SENTRY_PROJECT=l1-game-server-pro
    - export VERSION=game-server@${CI_COMMIT_SHA:1}
  script:
    - sentry-cli releases new $VERSION
    - sentry-cli releases set-commits --auto $VERSION
    - sentry-cli releases finalize $VERSION
    - sentry-cli releases deploys $VERSION new -e PRO
    - echo "Finalized release for $VERSION"
  tags:
    - docker
  needs: ["prod_deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always

prod_restart:
  extends: .restart-service
  environment:
    name: RESTART-PRO
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-rs-pro-\d{8}-\d+.*$/
      when: always