image: keymetrics/pm2:6

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - cd src
    - apk update
    - apk --no-cache --update add build-base py-pip gcc
    - npm --build-from-source install bcrypt
    - npm install --build-from-source canvas@2.6.0
    - npm install
  tags:
    - deploy-node

deploy_prod:
  stage: deploy
  script:
    - echo "====== Deploy to production server ======"
    - apk update && apk upgrade
    - apk add git openssh bash
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    # Delploy
    - pm2 deploy ecosystem.config.js production
  environment:
    name: deploying
  tags:
    - deploy-node
  only:
    - /^deploy-\d{8}-\d+.*$/
