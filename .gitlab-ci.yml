image: node:latest

stages:
  - deploy

deploy_LOCAL:
  stage: deploy
  before_script:
    - echo "====== Deploy to test server ======"
    - apk update && apk upgrade
    - apk add git openssh bash
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - tar czf - ./* | ssh root@$HOST "cd /var/www/l1/game-api/ && tar xvzf -"
    - ssh root@$HOST 'npm install --prefix /var/www/l1/game-api/ | cp /var/www/l1/game-api/config/appConfigs.LOCAL.js /var/www/l1/game-api/config/appConfigs.js | sudo service l1-game-api restart'
  environment:
    name: LOCAL
  tags:
    - docker
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    
deploy_SIT:
  stage: deploy
  before_script:
    - apk update && apk upgrade
    - apk add git openssh bash
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - mkdir ~/build
  script:
    - cp ./config/appConfigs.SIT.js ./config/appConfigs.js
    - git clone git@gitlab.com:l1-compiled/game-server-compiled.git ~/build
    - cp -R ./* ~/build
    - cd ~/build
    - git config --global user.email "harrison.nguyen@luminetsoft.com"
    - git config --global user.name "Harrison"
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
    - echo "==============Waiting for after script execution=============="
    - sleep 60
  environment:
    name: SIT
  tags:
    - docker
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
