image: keymetrics/pm2:6

stages:
  - deploy
  - post-deploy
  - restart-service

before_script:
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
      echo "Continue deploying";
    else
      echo "This job has tag is not used for current repository";
      exit 1;
    fi
  - apk update && apk upgrade
  - apk add git openssh bash
  - eval $(ssh-agent -s)
  - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)

.base-deploy:
  stage: deploy
  tags:
    - docker

include:
  - local: .gitlab-ci-push-git-compiled.yml
  - local: .gitlab-ci-restart-service.yml
  - local: .gitlab-ci-local.yml
  - local: .gitlab-ci-sit.yml
  - local: .gitlab-ci-uat.yml
  - local: .gitlab-ci-pro.yml