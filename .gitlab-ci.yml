image: docker:19.03.12

variables:
  WORKING_PATH: /var/www/l1/game-server/
  DOCKER_SERVICE_NAME: l1-game-server
  DOCKER_IMAGE_PATH: l1/game-services/game-server
  CONFIG_FILE_NAME: appConfigs
  CONFIG_FILE_EXTENSION: js
  CONFIGS_SRC_DIR_PATH: ./src/config
  CONFIG_CONTAINER_PATH: /opt/node_app/src/config/appConfigs.js
  PROJECT_NAME: l1-game-server

services:
  - docker:19.03.12-dind

stages:
  - test
  - build
  - post-build
  - deploy

include:
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "sonarqube.gitlab-ci.yml"
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "before-script-docker.gitlab-ci.yml"
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "l1-rules.gitlab-ci.yml"
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "build-docker-image.gitlab-ci.yml"
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "post-build-docker-image.gitlab-ci.yml"
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "deploy-docker.gitlab-ci.yml"
  - local: .gitlab-ci/deploy-local.gitlab-ci.yml
  - local: .gitlab-ci/deploy-sit.gitlab-ci.yml
  - local: .gitlab-ci/deploy-uat.gitlab-ci.yml
  - local: .gitlab-ci/deploy-prod.gitlab-ci.yml
