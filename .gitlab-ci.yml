image: keymetrics/pm2:6

variables:
  GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/game-server-compiled.git

stages:
  - deploy

before_script:
  - echo "====== Deploy to test server ======"
  - apk update && apk upgrade
  - apk add git openssh bash
  - eval $(ssh-agent -s)
  - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'

local_deploy:
  stage: deploy
  script:
    - tar czf - ./* | ssh root@$HOST "cd /var/www/l1/game-api/ && tar xvzf -"
    - ssh root@$HOST 'npm install --prefix /var/www/l1/game-api/ | cp /var/www/l1/game-api/config/appConfigs.LOCAL.js /var/www/l1/game-api/config/appConfigs.js | sudo service l1-game-api restart'
  environment:
    name: LOCAL
  tags:
    - docker
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-local-\d{8}-\d+.*$/
    
sit_deploy:
  stage: deploy
  script:
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - mkdir ~/build
    - cp ./config/appConfigs.SIT.js ./config/appConfigs.js
    - git clone --branch SIT $GIT_COMPILED_REPO ~/build
    - cp -R ./* ~/build
    - cd ~/build
    - git config --global user.email "luminet.minigame.app@gmail.com"
    - git config --global user.name "Luminet"
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin SIT;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  environment:
    name: SIT
  tags:
    - docker
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-sit-\d{8}-\d+.*$/

uat_deploy:
  stage: deploy
  script:
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - mkdir ~/build
    - cp ./config/appConfigs.UAT.js ./config/appConfigs.js
    - git clone --branch UAT $GIT_COMPILED_REPO ~/build
    - cp -R ./* ~/build
    - cd ~/build
    - git config --global user.email "luminet.minigame.app@gmail.com"
    - git config --global user.name "Luminet"
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin UAT;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  environment:
    name: UAT
  tags:
    - docker
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-uat-\d{8}-\d+.*$/

prod_deploy:
  stage: deploy
  script:
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - mkdir ~/build
    - cp ./config/appConfigs.PRO.js ./config/appConfigs.js
    - git clone $GIT_COMPILED_REPO ~/build
    - cp -R ./* ~/build
    - cd ~/build
    - git config --global user.email "luminet.minigame.app@gmail.com"
    - git config --global user.name "Luminet"
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin master;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  environment:
    name: PRO
  tags:
    - docker
  when: manual
  only:
    - master