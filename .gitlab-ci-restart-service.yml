.base-restart-service:
  stage: restart-service
  tags:
    - docker

.restart-service:
  extends: 
    - .base-restart-service
  script:
    - echo "====== Pushing git compiled ... ======"
    - git config --global user.email "luminet.minigame.app@gmail.com"
    - git config --global user.name "Luminet"
    - if [ "$CI_ENVIRONMENT_NAME" == "RESTART-PRO" ]; then
        export GIT_BRANCH=master;
      elif [ "$CI_ENVIRONMENT_NAME" == "RESTART-UAT" ]; then
        export GIT_BRANCH=UAT;
      elif [ "$CI_ENVIRONMENT_NAME" == "RESTART-LOCAL" ]; then
        export GIT_BRANCH=LOCAL;
      else
        export GIT_BRANCH=SIT;
      fi
    - echo $GIT_BRANCH
    - mkdir ~/build
    - git clone --branch $GIT_BRANCH $GIT_COMPILED_REPO ~/build
    - cd ~/build
    - echo "====== Add temp file to trigger change compiled ======"
    - echo "$CI_JOB_ID" > temp.json
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi