sit_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: SIT
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - when: never

sit_restart:
  extends: .restart-service
  environment:
    name: RESTART-SIT
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-rs-sit-\d{8}-\d+.*$/
      when: always