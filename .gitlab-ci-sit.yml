sit_deploy:
  extends: 
    - .base-deploy
    - .push-git-compiled
  environment:
    name: SIT
    url: http://sit-gsr.saba.vin/
  only:
    - /^l1-deploy-sit-\d{8}-\d+.*$/
    - /^l1-deploy-\d{8}-\d+.*$/

sit_restart:
  extends: .restart-service
  environment:
    name: RESTART-SIT
  only: 
    - /^l1-rs-sit-\d{8}-\d+.*$/