post_build_sit:
  extends:
    - .post_build
    - .deploy:sit:rules
  needs: ["build_image"]
  environment:
    name: SIT

deploy_sit:
  extends:
    - .base_deploy_swarm_service
    - .deploy:sit:rules
  needs: ["post_build_sit"]
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 1
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 6200
    DOCKER_PRIVATE_PORT: 6200
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: SIT
